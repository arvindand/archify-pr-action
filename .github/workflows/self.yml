name: archify-self
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: archify-self-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  archify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
